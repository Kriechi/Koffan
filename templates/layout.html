<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koffan Shopping List</title>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="/static/favicon-96.png" sizes="96x96">
    <link rel="icon" type="image/png" href="/static/icon-192.png" sizes="192x192">
    <link rel="icon" href="/static/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
    <meta name="theme-color" content="#f9a8d4">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Dark mode initialization (must run before body renders to prevent flash) -->
    <script>
        (function() {
            function getThemePreference() {
                const stored = localStorage.getItem('theme');
                if (stored === 'dark' || stored === 'light') return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            const theme = getThemePreference();
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
            window.getThemePreference = getThemePreference;
        })();
    </script>

    {{if .Workspace}}
    <!-- Accounts: which user and workspace this page was rendered for -->
    <meta name="koffan-user" content="{{.User.ID}}">
    <meta name="koffan-workspace" content="{{.Workspace.ID}}">
    <script>
        (function () {
            var user = document.querySelector('meta[name="koffan-user"]').content;
            var workspace = document.querySelector('meta[name="koffan-workspace"]').content;

            // The offline copy (IndexedDB, cached pages) belongs to one account
            // and workspace. When another account or workspace opens the app on
            // this browser, drop it before anything reads it. The same account
            // coming back keeps its copy, including changes not yet synced.
            try {
                var owner = user + ':' + workspace;
                var previous = localStorage.getItem('koffan-owner');
                if (previous !== null && previous !== owner) {
                    indexedDB.deleteDatabase('koffan-offline');
                    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
                    }
                }
                localStorage.setItem('koffan-owner', owner);
            } catch (e) {}

            // Tell the server which workspace this page belongs to. If the
            // session has moved on (switched in another tab), the server answers
            // 409 and the stale page reloads instead of writing to the wrong one.
            var nativeFetch = window.fetch;
            window.fetch = function (input, init) {
                try {
                    var request = new Request(input, init);
                    if (new URL(request.url).origin === location.origin) {
                        request.headers.set('X-Koffan-Workspace', workspace);
                    }
                    return nativeFetch.call(this, request).then(function (response) {
                        if (response.status === 409 && response.headers.get('X-Workspace-Mismatch')) location.reload();
                        return response;
                    });
                } catch (e) {
                    return nativeFetch.call(this, input, init);
                }
            };
            document.addEventListener('htmx:configRequest', function (e) {
                e.detail.headers['X-Koffan-Workspace'] = workspace;
            });
            document.addEventListener('htmx:responseError', function (e) {
                var xhr = e.detail && e.detail.xhr;
                if (xhr && xhr.status === 409 && xhr.getResponseHeader('X-Workspace-Mismatch')) location.reload();
            });
        })();
    </script>
    {{else if .User}}
    <script>
        // Accounts, but no workspace to show (the last one was left or taken
        // away): nothing offline belongs to this page any more, so drop what
        // an earlier workspace left in this browser.
        try {
            if (localStorage.getItem('koffan-owner') !== null) {
                indexedDB.deleteDatabase('koffan-offline');
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
                }
                localStorage.removeItem('koffan-owner');
            }
        } catch (e) {}
    </script>
    {{end}}

    <!-- UI scale initialization (must run before body renders to prevent flash) -->
    <script src="{{asset "ui-scale.js"}}"></script>
    <script>
        (function() {
            function apply(resolved) {
                document.documentElement.style.fontSize = window.UIScale.scaleToFontSize(resolved);
                document.documentElement.setAttribute('data-ui-scale', resolved);
            }
            window.getUIScale = function() {
                var mod = window.UIScale;
                return mod ? mod.resolveScale(localStorage.getItem('uiScale')) : 'normal';
            };
            window.setUIScale = function(scale) {
                var mod = window.UIScale;
                if (!mod) return;
                var resolved = mod.resolveScale(scale);
                localStorage.setItem('uiScale', resolved);
                apply(resolved);
            };
            if (window.UIScale) {
                apply(window.getUIScale());
            }
        })();
    </script>

    <!-- i18n translations -->
    <script>
        // The server embeds only its page language and English (the fallback).
        window.translations = {{.Translations}};
        window.pageLang = {{.PageLang | toJSON}};
        window.locales = {{.Locales | toJSON}};
        window.defaultLang = {{.DefaultLang | toJSON}};

        // Language: localStorage > page language (lang cookie or server default)
        (function() {
            const stored = localStorage.getItem('language');
            if (stored && !window.translations[stored] && window.locales.some(locale => locale.code === stored)) {
                // The page language comes from the lang cookie. Restore a missing
                // or expired cookie from the saved choice and reload once.
                document.cookie = 'lang=' + stored + ';path=/;max-age=31536000;SameSite=Lax';
                try {
                    if (sessionStorage.getItem('languageSync') !== stored) {
                        sessionStorage.setItem('languageSync', stored);
                        location.reload();
                    }
                } catch (e) {}
            }
            window.currentLang = stored && window.translations[stored] ? stored : window.pageLang;
            // Set page title based on language
            document.title = window.translations[window.currentLang]?.list?.title || 'Koffan Shopping List';
            // Also set html lang attribute
            document.documentElement.lang = window.currentLang;
        })();

        // Translation helper function
        function t(key, params) {
            const lang = window.currentLang;
            const keys = key.split('.');
            const lookup = language => keys.reduce((value, part) => value && typeof value === 'object' ? value[part] : undefined, window.translations[language]);
            const value = lookup(lang) ?? lookup('en');
            if (typeof value !== 'string') return key;

            // Replace {{ "{{" }}param{{ "}}" }} placeholders
            if (params) {
                return value.replace(/\{\{(\w+)\}\}/g, (match, param) => {
                    return params[param] !== undefined ? params[param] : match;
                });
            }
            return value;
        }

        // Language change helper
        function changeLanguage(lang) {
            localStorage.setItem('language', lang);
            document.cookie = 'lang=' + lang + ';path=/;max-age=31536000;SameSite=Lax';
            window.location.reload();
        }

        // Theme change helper
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.querySelector('meta[name="theme-color"]').content = '#1c1917';
            } else if (theme === 'light') {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.querySelector('meta[name="theme-color"]').content = '#f9a8d4';
            } else {
                // 'system' - remove stored preference
                localStorage.removeItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.classList.toggle('dark', prefersDark);
                document.querySelector('meta[name="theme-color"]').content = prefersDark ? '#1c1917' : '#f9a8d4';
            }
        }

        // Listen for system preference changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme('system');
            }
        });
    </script>

    <style>
        /* The same row is used for optimistic updates and server rendering. */
        [data-sort-mode="alphabetical"] .drag-handle,
        [data-sort-mode="alphabetical_desc"] .drag-handle { display: none; }
        /* "Move" only targets other sections, so hide it when the list has just one. */
        body:not(:has(#sections-list > [data-section-id] ~ [data-section-id])) .item-move { display: none; }
        .shopping-item[data-completed="true"] {
            padding-top: 0.625rem;
            padding-bottom: 0.625rem;
            gap: 0.75rem;
        }
        .shopping-item[data-completed="true"]:not(.bg-rose-50\/40) { background-color: transparent; }
        .shopping-item[data-completed="true"]:hover { background-color: rgb(245 245 244 / 0.5); }
        .dark .shopping-item[data-completed="true"]:hover { background-color: rgb(68 64 60 / 0.5); }
        .shopping-item[data-completed="true"] .drag-handle,
        .shopping-item[data-completed="true"] .item-active-actions,
        .shopping-item[data-completed="true"] .item-uncertain { display: none; }
        .shopping-item[data-completed="true"] .item-completed-delete { display: block; }
        .shopping-item[data-completed="true"] .item-content { margin-left: 0; }
        .shopping-item[data-completed="true"] .item-name,
        .shopping-item[data-completed="true"] .item-quantity {
            color: #a8a29e;
            text-decoration-line: line-through;
        }
        .shopping-item[data-completed="true"] .item-description {
            color: #d6d3d1;
            text-decoration-line: line-through;
            margin-top: 0;
        }
        .dark .shopping-item[data-completed="true"] .item-name,
        .dark .shopping-item[data-completed="true"] .item-quantity,
        .dark .shopping-item[data-completed="true"] .item-description { color: #78716c; }
        :root {
            --app-viewport-height: 100vh;
            --mobile-sheet-offset: 1rem;
        }

        [x-cloak] { display: none !important; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-indicator { display: none; }

        /* HTMX animations */
        .htmx-added {
            animation: slideIn 0.25s ease-out;
        }
        .htmx-swapping {
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Item animations */
        .item-enter {
            animation: itemEnter 0.3s ease-out;
        }
        @keyframes itemEnter {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .item-exit {
            animation: itemExit 0.2s ease-in forwards;
        }
        @keyframes itemExit {
            to {
                opacity: 0;
                transform: translateX(20px) scale(0.95);
            }
        }

        /* Checkbox pulse */
        .checkbox-pulse {
            animation: pulse 0.3s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Section fade */
        .section-fade {
            animation: sectionFade 0.3s ease-out;
        }
        @keyframes sectionFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Smooth list refresh - prevents flash */
        #sections-list {
            transition: opacity 0.15s ease-out;
        }
        #sections-list.htmx-request {
            opacity: 0.7;
        }

        /* Disable animations during move */
        .moving-item {
            animation: none !important;
        }

        /* Prevent Chrome Android PWA native pull-to-refresh from interfering with custom PTR */
        html, body {
            overscroll-behavior-y: none;
        }

        /* Prevent zoom on touch devices */
        * {
            touch-action: manipulation;
        }

        /* Prevent iOS zoom on input focus (requires 16px minimum), while still
           scaling up with the UI size setting at larger presets */
        input, textarea, select {
            font-size: max(1rem, 16px) !important;
        }

        /* Logo counter-scaling: the rest of the UI scales up with the UI size
           setting, but the logo should shrink at larger presets so it stops
           crowding the header text (e.g. the list name on the list page).
           --logo-scale is multiplied into rem-based heights: at large/huge it
           dips below the level that would merely keep the logo constant, making
           it visibly smaller than at Normal. */
        :root { --logo-scale: 1; }
        html[data-ui-scale="large"] { --logo-scale: 0.82; }
        html[data-ui-scale="huge"]  { --logo-scale: 0.7; }
        .app-logo-home {
            height: calc(3rem * var(--logo-scale));
        }
        .app-logo-header {
            height: calc(2rem * var(--logo-scale));
        }
        @media (min-width: 768px) {
            .app-logo-header {
                height: calc(2.5rem * var(--logo-scale));
            }
        }

        /* Pull to refresh */
        .pull-to-refresh-spinner {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translate(-50%, -100%);
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s ease-out;
            pointer-events: none;
        }
        .dark .pull-to-refresh-spinner {
            background: #292524;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .pull-to-refresh-spinner.visible {
            opacity: 1;
        }
        .pull-to-refresh-spinner svg {
            width: 20px;
            height: 20px;
            color: #f472b6;
            transition: transform 0.1s ease-out;
        }
        .pull-to-refresh-spinner.refreshing svg {
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Refresh overlay */
        .refresh-overlay {
            position: fixed;
            inset: 0;
            background: #fafaf9;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-out;
        }
        .dark .refresh-overlay {
            background: #1c1917;
        }
        .refresh-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .refresh-overlay.fade-out {
            opacity: 0;
        }

        /* Safe area for bottom navigation on notched devices */
        .safe-area-pb {
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        @media (max-width: 767px) {
            .mobile-sheet {
                max-height: calc(var(--app-viewport-height, 100vh) - var(--mobile-sheet-offset));
            }

            .mobile-sheet-scroll {
                overflow-y: auto;
                padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)) !important;
            }
        }

        /* Custom scrollbar for dark mode */
        .dark ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #292524;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #57534e;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #78716c;
        }
        /* Firefox */
        .dark * {
            scrollbar-color: #57534e #292524;
            scrollbar-width: thin;
        }

        /* Drag-and-drop states */
        [data-item-id] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .sortable-ghost {
            opacity: 0.5;
            background: #fce7f3 !important;
        }
        .dark .sortable-ghost {
            background: rgba(244, 114, 182, 0.3) !important;
        }
        .sortable-chosen {
            background: #fdf2f8 !important;
            border-left: 3px solid #ec4899 !important;
        }
        .dark .sortable-chosen {
            background: rgba(244, 114, 182, 0.15) !important;
            border-left: 3px solid #ec4899 !important;
        }
        .sortable-drag {
            opacity: 0 !important;
        }
        body.is-dragging {
            overflow: hidden;
            touch-action: none;
            cursor: grabbing !important;
        }
        body.is-dragging * {
            cursor: grabbing !important;
        }
        .drag-handle {
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .drag-handle:active {
            opacity: 1;
        }
        .is-dragging * {
            user-select: none;
            -webkit-user-select: none;
        }
        .drag-drop-target {
            border: 2px dashed #d6d3d1 !important;
            background: white !important;
        }
        .dark .drag-drop-target {
            border-color: #57534e !important;
            background: #292524 !important;
        }
        .drag-drop-target .completed-wrapper,
        .drag-drop-target .section-counter,
        .drag-drop-target .flex.items-center.gap-2.flex-shrink-0 {
            display: none !important;
        }
        .drag-drop-target .items-sortable {
            min-height: 48px;
            position: relative;
        }
        .drag-drop-target .items-sortable::before {
            content: attr(data-drop-hint);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            color: #a8a29e;
            font-size: 0.8rem;
        }
        .dark .drag-drop-target .items-sortable::before {
            color: #78716c;
        }
        .drag-drop-target .items-sortable:has(.sortable-ghost)::before {
            display: none;
        }
        .drag-drop-target .items-sortable > [data-item-id] ~ .items-sortable::before {
            display: none;
        }
        .drag-drop-target h3 {
            pointer-events: none;
        }
    </style>

    <!-- Tailwind CSS, prebuilt by `npm run build:css`. It follows the inline
         styles above so utilities keep winning ties in the cascade. -->
    <link rel="stylesheet" href="{{asset "app.css"}}">
</head>
<body class="bg-gray-100 dark:bg-stone-900 min-h-screen transition-colors duration-200">
    <!-- Refresh overlay -->
    <div id="refresh-overlay" class="refresh-overlay"></div>

    <!-- Pull to refresh indicator -->
    <div id="pull-to-refresh" class="pull-to-refresh-spinner">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
    </div>

    {{embed}}

    <!-- Libraries load after the content so they do not delay the first paint.
         Alpine is deferred and starts last, after the collapse plugin and app code. -->
    <script src="{{asset "htmx.min.js"}}"></script>
    <script src="{{asset "sortable.min.js"}}"></script>
    <script src="{{asset "alpine-collapse.min.js"}}"></script>
    <script defer src="{{asset "alpine.min.js"}}"></script>
    <script src="{{asset "viewport.js"}}"></script>
    <script src="{{asset "offline-storage.js"}}"></script>
    <script src="{{asset "realtime.js"}}"></script>
    <script>window.offlineBootstrap = {{.OfflineSnapshot | toJSON}};</script>
    <script src="{{asset "app.js"}}"></script>
    <script src="{{asset "offline-crud.js"}}"></script>
    <script src="{{asset "offline-view.js"}}"></script>
    <script src="{{asset "offline-app.js"}}"></script>
    <script>
        window.ViewportHeight?.initViewportHeightSync(window, document);
    </script>
    <script>
        // Register Service Worker with update handling
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('{{asset "sw.js"}}', { scope: '/' })
                .then(reg => {
                    console.log('[App] Service Worker registered:', reg.scope);
                    // Force update check
                    reg.update().catch(() => { /* Offline launches keep the installed worker. */ });
                    // Listen for new SW and activate immediately
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // New SW installed, tell it to skip waiting
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(err => console.error('[App] Service Worker registration failed:', err));

            // Reload page when new SW takes control. Skip the very first claim
            // (page was loaded uncontrolled, its content is already fresh) and
            // defer the reload while the user is typing so unsubmitted input
            // is not lost on deploy.
            let wasControlled = !!navigator.serviceWorker.controller;
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!wasControlled) {
                    wasControlled = true;
                    return;
                }
                if (refreshing) return;
                refreshing = true;
                const el = document.activeElement;
                const isTyping = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && el.value;
                if (isTyping) {
                    document.addEventListener('visibilitychange', function onHidden() {
                        if (document.hidden) {
                            document.removeEventListener('visibilitychange', onHidden);
                            window.location.reload();
                        }
                    });
                } else {
                    window.location.reload();
                }
            });

            // Clear SW caches on logout so the cached authenticated app shell
            // is not served offline to the next user of a shared device.
            document.addEventListener('submit', (e) => {
                const form = e.target;
                if (form.matches?.('form[action="/logout"]')) {
                    navigator.serviceWorker.controller?.postMessage({ type: 'CLEAR_CACHE' });
                }
            }, true);
        }
    </script>
</body>
</html>
